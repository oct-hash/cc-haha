name: Nightly Full Quality Gate

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      - run: bun install --frozen-lockfile

      - name: Run full quality gate (release mode)
        run: bun run quality-gate --mode release --allow-live --json > gate-report.json
        continue-on-error: true

      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gate-report
          path: gate-report.json

      - name: Report summary
        if: always()
        run: |
          echo "Nightly quality gate completed at $(date)"
          if grep -q '"failed": *0' gate-report.json; then
            echo "✅ All 14 lanes passed"
          else
            echo "⚠️ Some lanes failed — review the artifact"
          fi
