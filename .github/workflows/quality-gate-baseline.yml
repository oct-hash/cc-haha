name: Update Coverage Baseline

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'scripts/quality-gate/**'

jobs:
  baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      - run: bun install --frozen-lockfile

      - name: Run baseline update
        run: bun run quality-gate:baseline

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/quality-gate/data/coverage-baseline.json
          if git diff --staged --quiet; then
            echo "No baseline changes"
          else
            git commit -m "chore: update coverage baseline [skip ci]"
            git push
          fi
